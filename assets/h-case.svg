<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="60" viewBox="0 0 1000 60" role="img" aria-label="$ cat case-001/briefing.txt">
<style>
.m{font-family:Consolas,Menlo,"DejaVu Sans Mono","Courier New",monospace;font-size:22px}
.cover{transform-box:fill-box;transform-origin:right center;animation:type 1.75s steps(25) .3s forwards}
.cur{animation:move 1.75s steps(25) .3s forwards, blink 1s steps(1) infinite}
